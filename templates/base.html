<!doctype html>
<html lang="{{ (locale or 'en')|replace('_', '-') }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Samuel Simonds - Web Design and Technologies</title>
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.svg') }}" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar-inner">
        <div class="topbar-left"></div>

        <div class="brand">
          <a href="{{ url_for('index') }}" class="brand-link">Samuel Ryan Andrew Simonds</a>
        </div>

        <div class="topbar-right">
          {% if request.path.startswith('/admin') and session.get('admin_authed') %}
            <nav class="nav">
              <form method="post" action="{{ url_for('admin_logout') }}" class="inline">
                <button type="submit" class="linklike">Log out</button>
              </form>
            </nav>
          {% endif %}
        </div>
      </div>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <div>&copy; {{ current_year }} Samuel Ryan Andrew Simonds</div>
      </div>
    </footer>

    <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
